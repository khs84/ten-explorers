<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>십의 탐험대</title>
<meta name="description" content="달걀·나뭇잎·과자·별을 10개씩 묶으며 20까지의 수를 배우는 접근성 지원 수학 게임">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="page">
    <header class="hero">
      <div class="compass" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="var(--paper-panel)" stroke="var(--trail-dark)" stroke-width="5"/>
          <g class="needle">
            <polygon points="50,14 58,50 50,86 42,50" fill="var(--boss)"/>
            <polygon points="50,14 58,50 50,50 42,50" fill="var(--gold)"/>
          </g>
          <circle cx="50" cy="50" r="6" fill="var(--trail-dark)"/>
        </svg>
      </div>
      <h1 id="heroTitle">십의 탐험대</h1>
      <p id="heroDesc"></p>
      <span class="tagline" id="heroTagline"></span>
    </header>

    <main id="main">
      <h2 class="sr-only">진행 상황</h2>
      <ul class="stamps" id="stamps" aria-label="모은 도장"></ul>

      <h2 class="sr-only">미션 목록</h2>
      <ul class="trail" id="trail"></ul>

      <div id="celebrateSlot" aria-live="off"></div>
    </main>

    <footer class="footer-row">
      <button class="reset-link" id="resetBtn" type="button">처음부터 다시 탐험하기</button>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
