<title>십의 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --paper:#F7EFD8;
    --paper-panel:#FFFBF0;
    --ink:#3A2E22;
    --ink-soft:#6B5C48;
    --trail:#2F7A5E;
    --trail-dark:#1F5A44;
    --gold:#E0A83B;
    --gold-ink:#7A5615;
    --line:#D8C9A3;
    --night:#1B2436;
    --night-line:#31406A;
    --shadow: 0 8px 20px -8px rgba(58,46,34,0.4);
    --egg:#F2C14E;      --egg-ink:#8A6412;
    --leaf:#5F9F63;     --leaf-ink:#2F5A32;
    --cookie:#C68A4C;   --cookie-ink:#6B4321;
    --star:#F4D35E;     --star-ink:#8B5FBF;
    --boss:#C0483C;     --boss-ink:#6F251E;
    --ok:#2F7A5E;
    --bad:#B24A3C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161C2C;
      --paper-panel:#212A40;
      --ink:#F3E9D2;
      --ink-soft:#C9BCA0;
      --trail:#5FC79B;
      --trail-dark:#3E9C77;
      --gold:#F2C879;
      --gold-ink:#F6D998;
      --line:#3B4867;
      --shadow: 0 10px 26px -8px rgba(0,0,0,0.6);
      --ok:#6FD9A8;
      --bad:#FF9686;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161C2C;
    --paper-panel:#212A40;
    --ink:#F3E9D2;
    --ink-soft:#C9BCA0;
    --trail:#5FC79B;
    --trail-dark:#3E9C77;
    --gold:#F2C879;
    --gold-ink:#F6D998;
    --line:#3B4867;
    --shadow: 0 10px 26px -8px rgba(0,0,0,0.6);
    --ok:#6FD9A8;
    --bad:#FF9686;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', system-ui, sans-serif;
    padding-inline:16px;
    padding-block:28px 56px;
  }
  h1,h2,h3{font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:6px;}

  .page{max-width:640px; margin-inline:auto; display:flex; flex-direction:column; gap:28px;}

  /* ---------- Hero ---------- */
  .hero{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding-block:8px 4px;}
  .compass{width:76px; height:76px; position:relative; flex-shrink:0;}
  .compass svg{width:100%; height:100%; display:block;}
  .compass .needle{transform-origin:50% 50%; animation:sway 6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(14deg);}}
  .hero h1{font-size:clamp(28px,7vw,38px); color:var(--trail-dark);}
  .hero p{margin:0; color:var(--ink-soft); font-size:15px; max-width:44ch;}
  .hero .tagline{font-size:13px; color:var(--gold-ink); background:color-mix(in srgb, var(--gold) 24%, transparent); border-radius:999px; padding:5px 14px; font-weight:700;}

  /* ---------- Progress strip ---------- */
  .stamps{display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
  .stampslot{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:3px dashed var(--line); background:var(--paper-panel);
    font-size:22px; transition:transform .3s ease, box-shadow .3s ease;
  }
  .stampslot.earned{border-style:solid; box-shadow:var(--shadow); transform:scale(1.06);}

  /* ---------- Trail ---------- */
  .trail{position:relative; display:flex; flex-direction:column; gap:22px; padding-top:4px;}
  .trail::before{
    content:""; position:absolute; left:27px; top:8px; bottom:8px; width:4px;
    background:repeating-linear-gradient(var(--line),var(--line) 8px, transparent 8px, transparent 16px);
  }

  .station{position:relative; padding-left:64px;}
  .station-badge{
    position:absolute; left:0; top:2px; width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    background:var(--paper-panel); border:3px solid var(--line); box-shadow:var(--shadow);
    z-index:1;
  }
  .station.locked .station-badge{filter:grayscale(1); opacity:.55;}
  .station.done .station-badge{border-color:var(--ok);}

  .card{
    background:var(--paper-panel); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 18px; cursor:pointer; user-select:none; background:none; border:none; width:100%; text-align:left; color:inherit;
  }
  .station.locked .card-head{cursor:not-allowed;}
  .station-title{font-family:'Jua','Noto Sans KR',sans-serif; font-size:19px; font-weight:400;}
  .card-head .sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .status-pill{font-size:12px; font-weight:700; border-radius:999px; padding:4px 10px; white-space:nowrap;}
  .status-pill.locked{background:color-mix(in srgb, var(--ink-soft) 18%, transparent); color:var(--ink-soft);}
  .status-pill.ready{background:color-mix(in srgb, var(--trail) 20%, transparent); color:var(--trail-dark);}
  .status-pill.done{background:color-mix(in srgb, var(--ok) 22%, transparent); color:var(--ok);}

  .card-body{padding:0 18px 20px; display:none;}
  .card-body.open{display:block;}
  .instruction{font-size:14px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5;}

  .stage-btn{
    border-radius:12px; border:2px solid transparent; padding:10px 18px; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .stage-btn:active{transform:scale(.96);}
  .stage-btn[disabled]{opacity:.4; cursor:not-allowed;}
  .stage-btn.primary{background:var(--trail); color:#fff; box-shadow:0 4px 0 var(--trail-dark);}
  .stage-btn.primary:not([disabled]):hover{filter:brightness(1.05);}
  .stage-btn.ghost{background:transparent; border-color:var(--line); color:var(--ink);}

  .feedback{margin-top:12px; font-size:14px; font-weight:700; min-height:20px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}

  /* choice buttons */
  .choices{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .choice{
    flex:1 1 80px; min-width:72px; padding:14px 8px; border-radius:14px; border:2px solid var(--line);
    background:var(--paper); font-size:22px; font-weight:700; font-family:'Jua',sans-serif; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .choice:hover:not([disabled]){border-color:var(--trail);}
  .choice:active:not([disabled]){transform:scale(.94);}
  .choice.correct{background:color-mix(in srgb, var(--ok) 22%, var(--paper)); border-color:var(--ok);}
  .choice.wrong{background:color-mix(in srgb, var(--bad) 18%, var(--paper)); border-color:var(--bad); animation:shake .35s;}
  .choice[disabled]{opacity:.5; cursor:not-allowed;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  /* egg stage */
  .egg-scene{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end; margin-bottom:6px;}
  .carton{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:10px; border-radius:14px;
    background:color-mix(in srgb, var(--egg) 14%, var(--paper)); border:2px solid var(--egg-ink);
  }
  .carton-label{font-size:11px; text-align:center; color:var(--ink); font-weight:700; margin-bottom:4px; grid-column:1/-1;}
  .egg{width:30px; height:38px; background:var(--egg); border:2px solid var(--egg-ink); border-radius:50% 50% 50% 50% / 62% 62% 42% 42%;}
  .loose-tray{display:flex; flex-wrap:wrap; gap:8px; max-width:160px; align-items:center;}
  .loose-tray .egg{transform:rotate(var(--r,0deg));}

  /* leaf stage */
  .tree-wrap{display:flex; justify-content:center; margin-bottom:10px;}
  .tree{position:relative; width:100%; max-width:320px;}
  .trunk{width:26px; height:54px; background:var(--cookie-ink); margin:0 auto; border-radius:4px;}
  .canopy{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:14px;
    background:color-mix(in srgb, var(--leaf) 12%, var(--paper)); border-radius:50% / 30%; margin-bottom:-8px;
  }
  .leaf{
    width:34px; height:34px; border-radius:0 100% 0 100%; transform:rotate(45deg) rotate(var(--r,0deg));
    background:var(--paper-panel); border:2px solid var(--leaf-ink); cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .leaf.colored{background:var(--leaf);}
  .leaf:hover{filter:brightness(1.08);}
  .leaf-counter{text-align:center; font-family:'Jua',sans-serif; font-size:16px; color:var(--ink); margin-top:8px;}

  /* cookie stage */
  .tray{
    display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:14px; margin-bottom:12px;
    background:color-mix(in srgb, var(--cookie) 14%, var(--paper)); border:2px dashed var(--cookie-ink); border-radius:16px;
    max-width:280px;
  }
  .slot{width:42px; height:42px; border-radius:50%; border:2px dashed color-mix(in srgb, var(--cookie-ink) 50%, transparent); display:flex; align-items:center; justify-content:center;}
  .cookie{
    width:38px; height:38px; border-radius:50%; background-color:var(--cookie);
    background-image:
      radial-gradient(circle at 30% 30%, var(--cookie-ink) 8%, transparent 9%),
      radial-gradient(circle at 65% 55%, var(--cookie-ink) 8%, transparent 9%),
      radial-gradient(circle at 42% 74%, var(--cookie-ink) 7%, transparent 8%);
    animation:pop .2s ease;
  }
  @keyframes pop{from{transform:scale(.3);} to{transform:scale(1);}}
  .tray-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .tray-counter{font-family:'Jua',sans-serif; font-size:16px; color:var(--ink);}

  /* star / boss night scene */
  .night{
    background:var(--night); border-radius:16px; padding:16px; margin-bottom:12px;
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:120px; align-content:center;
  }
  .star{
    width:34px; height:34px; cursor:pointer; background:var(--star);
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    transition:transform .15s ease, filter .15s ease; filter:brightness(.85);
  }
  .star.selected{filter:brightness(1.15) drop-shadow(0 0 6px var(--gold)); transform:scale(1.15);}
  .star.bundled{filter:grayscale(.3) brightness(.6);}
  .night-controls{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .night-counter{color:#fff; font-family:'Jua',sans-serif; font-size:15px;}

  /* boss */
  .boss-scene{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:10px;}
  .monster{position:relative; width:96px; height:84px;}
  .monster-body{
    position:absolute; inset:0; background:var(--boss); border:3px solid var(--boss-ink);
    border-radius:45% 55% 60% 40% / 55% 45% 55% 45%; transition:transform .4s ease;
  }
  .monster.hit .monster-body{animation:hit .4s ease;}
  @keyframes hit{0%{transform:scale(1);} 40%{transform:scale(.85) rotate(-4deg);} 100%{transform:scale(1);}}
  .monster.defeated .monster-body{transform:scale(0); opacity:0;}
  .eye{position:absolute; width:16px; height:16px; background:#fff; border-radius:50%; top:26px;}
  .eye::after{content:""; position:absolute; width:8px; height:8px; background:#1a1a1a; border-radius:50%; top:4px; left:4px;}
  .eye.l{left:20px;} .eye.r{right:20px;}
  .mouth{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); width:26px; height:12px; border-bottom:4px solid var(--boss-ink); border-radius:0 0 20px 20px;}
  .healthbar{display:flex; gap:6px;}
  .health-seg{width:34px; height:12px; border-radius:6px; background:color-mix(in srgb, var(--boss) 30%, var(--paper)); border:2px solid var(--boss-ink);}
  .health-seg.full{background:var(--boss);}

  /* completion overlay */
  .celebrate{
    text-align:center; padding:26px 20px; border-radius:20px; background:var(--paper-panel);
    border:2px solid var(--gold); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  .celebrate h2{font-size:26px; color:var(--gold-ink);}
  .celebrate .stamps{margin-top:4px;}

  .footer-row{display:flex; justify-content:center;}
  .reset-link{background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; padding:6px;}

  .confetti-piece{position:fixed; top:-10px; width:9px; height:14px; z-index:999; pointer-events:none; border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>

<div class="page">
  <div class="hero">
    <div class="compass" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="var(--paper-panel)" stroke="var(--trail-dark)" stroke-width="5"/>
        <g class="needle">
          <polygon points="50,14 58,50 50,86 42,50" fill="var(--boss)"/>
          <polygon points="50,14 58,50 50,50 42,50" fill="var(--gold)"/>
        </g>
        <circle cx="50" cy="50" r="6" fill="var(--trail-dark)"/>
      </svg>
    </div>
    <h1>십의 탐험대</h1>
    <p>달걀·나뭇잎·과자·별을 10개씩 묶으며 20까지의 수를 정복하는 탐험을 떠나요.</p>
    <span class="tagline">오늘의 미션: 10개를 한 묶음으로 만들어 봅시다</span>
  </div>

  <div class="stamps" id="stamps" aria-label="모은 도장"></div>

  <div class="trail" id="trail"></div>

  <div id="celebrateSlot"></div>

  <div class="footer-row">
    <button class="reset-link" id="resetBtn" type="button">처음부터 다시 탐험하기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "ten-explorers-v1";

  var STATIONS = [
    {id:"egg",    icon:"🥚", title:"달걀판 세기",     sub:"달걀판을 보고 모두 몇 개인지 알아봐요.", color:"egg"},
    {id:"leaf",   icon:"🍃", title:"나뭇잎 나무",      sub:"나뭇잎을 색칠하며 하나씩 세어 봐요.",   color:"leaf"},
    {id:"cookie", icon:"🍪", title:"과자 쟁반",       sub:"쟁반에 과자를 정확히 10개만 담아요.",   color:"cookie"},
    {id:"star",   icon:"⭐", title:"별 10개 묶기",     sub:"별 10개를 골라 묶고 모두 세어 봐요.",   color:"star"},
    {id:"boss",   icon:"🧭", title:"점 몬스터를 막아라!", sub:"점을 10개씩 묶어 몬스터를 물리쳐요.", color:"boss"}
  ];

  function defaultState(){
    return {unlocked:0, stamps:[false,false,false,false,false], openIndex:0, finished:false};
  }

  var state = defaultState();

  function loadLocal(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveLocal(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }
  function koreanTeen(n){
    var ones = ["","하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉"];
    if(n===10) return "열";
    if(n===20) return "스물";
    if(n>10 && n<20) return "열"+ones[n-10];
    return String(n);
  }
  function makeChoices(correct,min,max){
    var pool = [];
    for(var d=1; d<=4; d++){
      if(correct-d>=min) pool.push(correct-d);
      if(correct+d<=max) pool.push(correct+d);
    }
    shuffle(pool);
    var picks = [pool[0], pool[1]];
    var all = shuffle([correct, picks[0], picks[1]]);
    return all;
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==="class") e.className = attrs[k];
      else if(k==="text") e.textContent = attrs[k];
      else if(k==="html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

  function fireConfetti(count){
    var colors = ["#E0A83B","#5F9F63","#8B5FBF","#C0483C","#2F7A5E"];
    for(var i=0;i<count;i++){
      (function(){
        var p = document.createElement("div");
        p.className = "confetti-piece";
        var startX = Math.random()*window.innerWidth;
        p.style.left = startX+"px";
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
        document.body.appendChild(p);
        var duration = 1200+Math.random()*900;
        var drift = (Math.random()-0.5)*160;
        var anim = p.animate([
          {transform:p.style.transform+" translateY(0)", opacity:1},
          {transform:"translate("+drift+"px,"+(window.innerHeight*0.8)+"px) rotate("+Math.floor(Math.random()*720)+"deg)", opacity:0.9}
        ],{duration:duration, easing:"ease-out"});
        anim.onfinish = function(){ p.remove(); };
      })();
    }
  }

  // ---------------- Station renderers ----------------
  // Each render(container, onComplete) builds the mini-game and calls onComplete() once solved.

  function renderEgg(container, onComplete){
    var loose = randInt(1,9);
    var total = 10+loose;

    var carton = el("div",{class:"carton"});
    carton.appendChild(el("div",{class:"carton-label", text:"달걀판 (10개 들어있어요)"}));
    for(var i=0;i<10;i++) carton.appendChild(el("div",{class:"egg"}));

    var looseTray = el("div",{class:"loose-tray"});
    for(var j=0;j<loose;j++){
      var e = el("div",{class:"egg"});
      e.style.setProperty("--r", (randInt(-15,15))+"deg");
      looseTray.appendChild(e);
    }

    var scene = el("div",{class:"egg-scene"},[carton, looseTray]);
    container.appendChild(scene);
    container.appendChild(el("p",{class:"instruction", text:"달걀판 10개랑 남은 달걀을 합하면 모두 몇 개일까요?"}));

    var choices = makeChoices(total, 11, 19);
    var choiceRow = el("div",{class:"choices"});
    var feedback = el("div",{class:"feedback"});

    choices.forEach(function(n){
      var btn = el("button",{class:"choice", type:"button", text:String(n)});
      btn.addEventListener("click", function(){
        if(n===total){
          btn.classList.add("correct");
          Array.prototype.forEach.call(choiceRow.children, function(c){ c.disabled = true; });
          feedback.className = "feedback ok";
          feedback.textContent = "정답이에요! 열 개랑 "+loose+"개니까 "+koreanTeen(total)+"("+total+")이에요!";
          onComplete();
        } else {
          btn.classList.add("wrong");
          btn.disabled = true;
          feedback.className = "feedback bad";
          feedback.textContent = "다시 세어볼까요? 달걀판 10개에 남은 달걀 수를 더해봐요.";
        }
      });
      choiceRow.appendChild(btn);
    });

    container.appendChild(choiceRow);
    container.appendChild(feedback);
  }

  function renderLeaf(container, onComplete){
    var total = randInt(11,19);
    var canopy = el("div",{class:"canopy"});
    var coloredCount = 0;
    var counterLine = el("div",{class:"leaf-counter", text:"색칠한 나뭇잎: 0개"});

    for(var i=0;i<total;i++){
      var leaf = el("div",{class:"leaf", role:"button", tabindex:"0"});
      leaf.style.setProperty("--r",(randInt(-20,20))+"deg");
      (function(leaf){
        function toggle(){
          if(leaf.classList.contains("colored")) return;
          leaf.classList.add("colored");
          coloredCount++;
          counterLine.textContent = "색칠한 나뭇잎: "+coloredCount+"개";
          if(coloredCount===total){
            doneBtn.disabled = false;
            feedback.className="feedback ok";
            feedback.textContent = "나뭇잎을 모두 색칠했어요!";
          }
        }
        leaf.addEventListener("click", toggle);
        leaf.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggle(); } });
      })(leaf);
      canopy.appendChild(leaf);
    }

    container.appendChild(el("div",{class:"tree-wrap"},[
      el("div",{class:"tree"},[canopy, el("div",{class:"trunk"})])
    ]));
    container.appendChild(el("p",{class:"instruction", text:"나뭇잎을 하나씩 눌러 색칠하며 모두 세어 봅시다."}));
    container.appendChild(counterLine);

    var feedback = el("div",{class:"feedback"});
    var doneBtn = el("button",{class:"stage-btn primary", type:"button", text:"다 세었어요!", disabled:"true"});
    doneBtn.addEventListener("click", function(){
      feedback.className="feedback ok";
      feedback.textContent = "나무에는 나뭇잎이 모두 "+koreanTeen(total)+"("+total+")개 있어요!";
      doneBtn.disabled = true;
      onComplete();
    });
    container.appendChild(doneBtn);
    container.appendChild(feedback);
  }

  function renderCookie(container, onComplete){
    var target = 10;
    var count = 0;
    var tray = el("div",{class:"tray"});
    var slots = [];
    for(var i=0;i<target;i++){
      var slot = el("div",{class:"slot"});
      slots.push(slot);
      tray.appendChild(slot);
    }
    var counter = el("span",{class:"tray-counter num", text:"담은 과자: 0 / 10"});
    var addBtn = el("button",{class:"stage-btn primary", type:"button", text:"쿠키 담기"});
    var removeBtn = el("button",{class:"stage-btn ghost", type:"button", text:"하나 빼기", disabled:"true"});
    var feedback = el("div",{class:"feedback"});

    function refresh(){
      counter.textContent = "담은 과자: "+count+" / 10";
      addBtn.disabled = count>=target;
      removeBtn.disabled = count<=0;
    }
    addBtn.addEventListener("click", function(){
      if(count>=target) return;
      slots[count].appendChild(el("div",{class:"cookie"}));
      count++;
      refresh();
      if(count===target){
        feedback.className="feedback ok";
        feedback.textContent = "쟁반에 과자 10개를 정확히 담았어요!";
        onComplete();
      }
    });
    removeBtn.addEventListener("click", function(){
      if(count<=0) return;
      count--;
      slots[count].innerHTML = "";
      refresh();
      feedback.textContent = "";
    });

    container.appendChild(tray);
    container.appendChild(el("p",{class:"instruction", text:"쟁반에 과자를 정확히 10개만 담아 봅시다."}));
    container.appendChild(el("div",{class:"tray-controls"},[addBtn, removeBtn, counter]));
    container.appendChild(feedback);
  }

  function buildStarField(total){
    var stars = [];
    for(var i=0;i<total;i++) stars.push(el("div",{class:"star", role:"button", tabindex:"0"}));
    return stars;
  }

  function renderStarRound(container, total, onSolved, labelPrefix){
    var night = el("div",{class:"night"});
    var stars = buildStarField(total);
    stars.forEach(function(s){ night.appendChild(s); });

    var selected = 0;
    var counter = el("span",{class:"night-counter num", text:"고른 별: 0 / 10"});
    var bundleBtn = el("button",{class:"stage-btn primary", type:"button", text:"10개씩 묶기", disabled:"true"});
    var feedback = el("div",{class:"feedback"});
    var choiceRow = el("div",{class:"choices"});
    var bundled = false;

    function toggle(star){
      if(bundled) return;
      if(star.classList.contains("selected")){
        star.classList.remove("selected"); selected--;
      } else {
        if(selected>=10) return;
        star.classList.add("selected"); selected++;
      }
      counter.textContent = "고른 별: "+selected+" / 10";
      bundleBtn.disabled = selected!==10;
    }
    stars.forEach(function(star){
      star.addEventListener("click", function(){ toggle(star); });
      star.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggle(star); } });
    });

    bundleBtn.addEventListener("click", function(){
      bundled = true;
      bundleBtn.disabled = true;
      stars.forEach(function(s){ if(s.classList.contains("selected")) s.classList.add("bundled"); });
      var leftover = total-10;
      feedback.className = "feedback ok";
      feedback.textContent = "별 10개를 한 묶음으로 만들었어요! 남은 별은 "+leftover+"개예요.";

      var choices = makeChoices(total, 11, 20);
      choices.forEach(function(n){
        var btn = el("button",{class:"choice", type:"button", text:String(n)});
        btn.addEventListener("click", function(){
          if(n===total){
            btn.classList.add("correct");
            Array.prototype.forEach.call(choiceRow.children, function(c){ c.disabled = true; });
            feedback.textContent = "맞았어요! 별은 모두 "+koreanTeen(total)+"("+total+")개예요!";
            onSolved();
          } else {
            btn.classList.add("wrong"); btn.disabled = true;
            feedback.className = "feedback bad";
            feedback.textContent = "다시 생각해봐요. 열 개 묶음 더하기 남은 "+leftover+"개!";
          }
        });
        choiceRow.appendChild(btn);
      });
      container.appendChild(el("p",{class:"instruction", text:(labelPrefix||"")+"별은 모두 몇 개일까요?"}));
      container.appendChild(choiceRow);
    });

    container.appendChild(night);
    container.appendChild(el("div",{class:"night-controls"},[bundleBtn, counter]));
    container.appendChild(feedback);
  }

  function renderStar(container, onComplete){
    var total = randInt(11,19);
    renderStarRound(container, total, onComplete, "");
  }

  function renderBoss(container, onComplete){
    var wins = 0;
    var monsterWrap = el("div",{class:"monster"},[
      el("div",{class:"monster-body"}),
      el("div",{class:"eye l"}), el("div",{class:"eye r"}),
      el("div",{class:"mouth"})
    ]);
    var health = el("div",{class:"healthbar"},[
      el("div",{class:"health-seg full"}), el("div",{class:"health-seg full"})
    ]);
    var boss = el("div",{class:"boss-scene"},[monsterWrap, health]);
    container.appendChild(boss);
    container.appendChild(el("p",{class:"instruction", text:"점을 10개씩 묶어서 몬스터를 두 번 물리쳐요!"}));

    var roundHost = el("div",{});
    container.appendChild(roundHost);

    function playRound(){
      roundHost.innerHTML = "";
      var total = randInt(11,20);
      renderStarRound(roundHost, total, function(){
        monsterWrap.classList.add("hit");
        setTimeout(function(){ monsterWrap.classList.remove("hit"); }, 400);
        health.children[wins].classList.remove("full");
        wins++;
        fireConfetti(14);
        if(wins>=2){
          monsterWrap.classList.add("defeated");
          setTimeout(function(){
            var msg = el("p",{class:"feedback ok", text:"몬스터를 물리쳤어요! 탐험 성공!"});
            roundHost.appendChild(msg);
            onComplete();
          }, 300);
        } else {
          setTimeout(playRound, 500);
        }
      }, "2번째 도전! ");
    }
    playRound();
  }

  var RENDERERS = {egg:renderEgg, leaf:renderLeaf, cookie:renderCookie, star:renderStar, boss:renderBoss};

  // ---------------- Layout / progress ----------------

  function renderStamps(){
    var host = document.getElementById("stamps");
    host.innerHTML = "";
    STATIONS.forEach(function(st, i){
      var slot = el("div",{class:"stampslot"+(state.stamps[i]?" earned":""), title:st.title});
      slot.textContent = state.stamps[i] ? st.icon : "?";
      host.appendChild(slot);
    });
  }

  function statusFor(index){
    if(state.stamps[index]) return "done";
    if(index<=state.unlocked) return "ready";
    return "locked";
  }

  function renderTrail(){
    var host = document.getElementById("trail");
    host.innerHTML = "";
    STATIONS.forEach(function(st, index){
      var status = statusFor(index);
      var stationEl = el("div",{class:"station "+(status==="locked"?"locked":"")+(status==="done"?" done":"")});
      stationEl.appendChild(el("div",{class:"station-badge", text:st.icon}));

      var pill = el("span",{class:"status-pill "+status, text: status==="locked"?"잠김":(status==="done"?"완료!":"도전!")});
      var head = el("button",{class:"card-head", type:"button"},[
        el("div",{},[ el("div",{class:"station-title", text:st.title}), el("div",{class:"sub", text:st.sub}) ]),
        pill
      ]);
      var body = el("div",{class:"card-body"});
      var card = el("div",{class:"card"},[head, body]);

      head.addEventListener("click", function(){
        if(status==="locked") return;
        var isOpen = body.classList.contains("open");
        // collapse all other bodies
        Array.prototype.forEach.call(host.querySelectorAll(".card-body"), function(b){ b.classList.remove("open"); });
        if(!isOpen){
          body.classList.add("open");
          body.innerHTML = "";
          RENDERERS[st.id](body, function(){
            if(!state.stamps[index]){
              state.stamps[index] = true;
              if(state.unlocked < index+1) state.unlocked = index+1;
              saveLocal();
              renderStamps();
              fireConfetti(20);
              setTimeout(function(){ renderTrail(); checkFinished(); }, 500);
            }
          });
        }
      });

      stationEl.appendChild(card);
      host.appendChild(stationEl);
    });
  }

  function checkFinished(){
    if(state.stamps.every(Boolean) && !state.finished){
      state.finished = true;
      saveLocal();
      renderCelebrate();
    }
  }

  function renderCelebrate(){
    var host = document.getElementById("celebrateSlot");
    host.innerHTML = "";
    if(!state.finished) return;
    var stampsWrap = el("div",{class:"stamps"});
    STATIONS.forEach(function(st){
      stampsWrap.appendChild(el("div",{class:"stampslot earned", text:st.icon}));
    });
    host.appendChild(el("div",{class:"celebrate"},[
      el("h2",{text:"탐험 성공! 🎉"}),
      el("p",{text:"20까지의 수를 10개씩 묶어서 모두 세었어요. 정말 대단해요!"}),
      stampsWrap
    ]));
  }

  function resetAll(){
    state = defaultState();
    saveLocal();
    document.getElementById("celebrateSlot").innerHTML = "";
    renderStamps();
    renderTrail();
  }

  document.getElementById("resetBtn").addEventListener("click", function(){
    resetAll();
  });

  function render(){
    renderStamps();
    renderTrail();
    renderCelebrate();
  }

  function start(data){
    state = (data && typeof data==="object") ? Object.assign(defaultState(), data) : (loadLocal() || defaultState());
    render();
  }

  if(window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){ return state; });
  }
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
})();
</script>
